allowBuilds:
  sharp: true

# Transitive security pins (see `pnpm audit --prod`). Next pins postcss 8.4.31
# exactly, so only an override can clear it; next 15.5.27 declares support for
# sharp ^0.35.4; the adapter pins uuid ^8.
overrides:
  postcss@<8.5.18: 8.5.29
  sharp@<0.35.5: ^0.35.5
  nanoid@<3.3.18: ^3.3.20
  source-map-js@<1.2.2: ^1.2.2
  uuid@<11.1.1: ^11.1.1
